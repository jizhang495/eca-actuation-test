[project]
name = "eca-actuation-test"
version = "0.1.0"
description = "Electrochemical Actuator Testing Webapp - A unified interface for controlling, monitoring, and recording ECA experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyserial>=3.5",
    "matplotlib>=3.7.0",
    "ipython>=8.10.0",
    "pyvisa>=1.15.0",
    "pyvisa-py>=0.7.0",
    "httpx>=0.25.0",
]
