    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "appdirs>=1.4.4",
    "openai>=1.54.4",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
    "ipython>=8.10.0",
    "pyusb>=1.3.1",
    "opencv-python>=4.13.0.92",
    "scipy>=1.17.1",
    "moku>=4.2.2.1",
